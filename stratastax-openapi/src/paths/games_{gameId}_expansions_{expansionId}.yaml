parameters:
  - $ref: ../components/parameters/path_game_id.yaml
  - $ref: ../components/parameters/path_expansion_id.yaml
get:
  summary: Get expansion
  operationId: getExpansion
  security:
    - bearerAuth:
        - stx-engine:expansion-read
  tags:
    - expansions
  responses:
    '200':
      $ref: ../components/responses/expansion.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
patch:
  summary: Update expansion
  description: >
    Changes an expansion of a game. Requires the `stx-engine:expansion-update`
    role, which only the game catalog service has: it updates an expansion when a
    published candidate is approved again with new values.
  operationId: updateExpansion
  security:
    - bearerAuth:
        - stx-engine:expansion-update
  tags:
    - expansions
  parameters:
    - $ref: ../components/parameters/header_idempotency_key.yaml
    - $ref: ../components/parameters/header_if_match.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/requests/update_expansion.yaml
  responses:
    '200':
      $ref: ../components/responses/expansion.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '409':
      $ref: ../components/responses/conflict_error.yaml
    '412':
      $ref: ../components/responses/precondition_failed_error.yaml
    '422':
      $ref: ../components/responses/unprocessable_content_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
