parameters:
  - $ref: ../components/parameters/path_group_id.yaml
get:
  summary: List members of a group
  operationId: listGroupMembers
  tags:
    - groups
  parameters:
    - $ref: ../components/parameters/query_limit.yaml
    - $ref: ../components/parameters/query_cursor.yaml
    - $ref: ../components/parameters/query_filter.yaml
    - $ref: ../components/parameters/query_sort.yaml
  responses:
    '200':
      $ref: ../components/responses/group_member_list.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
post:
  summary: Add member to group
  operationId: addGroupMember
  tags:
    - groups
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/requests/add_group_member.yaml
  responses:
    '204':
      description: Member added successfully
    '400':
      $ref: ../components/responses/validation_error.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '409':
      $ref: ../components/responses/conflict_error.yaml
