post:
  summary: Pause the pipeline
  description: >
    Pauses one automatic step, or all of them without `step`. A step that is
    running finishes the item it is working on and then stops.
  operationId: pausePipeline
  security:
    - bearerAuth:
        - stx-game-catalog:pipeline-pause
  tags:
    - pipeline
  parameters:
    - $ref: ../components/parameters/query_pipeline_step.yaml
  responses:
    '200':
      $ref: ../components/responses/pipeline_status.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
