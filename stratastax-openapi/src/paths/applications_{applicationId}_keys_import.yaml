parameters:
  - $ref: ../components/parameters/path_application_id.yaml
post:
  summary: Import key catalog
  description: >
    Replaces the key catalog with the keys, base texts and arguments compiled
    from the translation files of the application (`stx i18n push`). New keys
    are added, changed keys are updated and missing keys become obsolete;
    translations are never deleted.
  operationId: importMessageKeys
  security:
    - bearerAuth:
        - stx-i18n:key-import
  tags:
    - keys
  parameters:
    - $ref: ../components/parameters/header_idempotency_key.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/requests/import_keys.yaml
  responses:
    '200':
      $ref: ../components/responses/import_keys_result.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '409':
      $ref: ../components/responses/conflict_error.yaml
    '422':
      $ref: ../components/responses/unprocessable_content_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
