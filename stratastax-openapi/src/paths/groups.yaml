get:
  summary: List groups owned by the authenticated user
  operationId: listGroups
  security:
    - bearerAuth:
        - stx-engine:group-read
  tags:
    - groups
  parameters:
    - $ref: ../components/parameters/query_limit.yaml
    - $ref: ../components/parameters/query_cursor.yaml
    - $ref: ../components/parameters/query_filter.yaml
    - $ref: ../components/parameters/query_sort.yaml
  responses:
    '200':
      $ref: ../components/responses/group_list.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
post:
  summary: Create group
  operationId: createGroup
  security:
    - bearerAuth:
        - stx-engine:group-create
  tags:
    - groups
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/requests/create_group.yaml
  responses:
    '201':
      $ref: ../components/responses/group.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '409':
      $ref: ../components/responses/conflict_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
