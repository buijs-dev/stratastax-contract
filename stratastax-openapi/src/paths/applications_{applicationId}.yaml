parameters:
  - $ref: ../components/parameters/path_application_id.yaml
get:
  summary: Get application
  operationId: getApplication
  security:
    - bearerAuth:
        - stx-i18n:application-read
  tags:
    - applications
  responses:
    '200':
      $ref: ../components/responses/application.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
patch:
  summary: Update application
  operationId: updateApplication
  security:
    - bearerAuth:
        - stx-i18n:application-update
  tags:
    - applications
  parameters:
    - $ref: ../components/parameters/header_idempotency_key.yaml
    - $ref: ../components/parameters/header_if_match.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/requests/update_application.yaml
  responses:
    '200':
      $ref: ../components/responses/application.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '409':
      $ref: ../components/responses/conflict_error.yaml
    '412':
      $ref: ../components/responses/precondition_failed_error.yaml
    '422':
      $ref: ../components/responses/unprocessable_content_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
