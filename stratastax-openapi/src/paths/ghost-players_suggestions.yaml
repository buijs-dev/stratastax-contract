get:
  summary: Get ghost player suggestions
  operationId: getGhostPlayerSuggestions
  security:
    - bearerAuth:
        - stx-engine:ghost-player-read
  tags:
    - ghostPlayers
  parameters:
    - $ref: ../components/parameters/query_query.yaml
  responses:
    '200':
      $ref: ../components/responses/ghost_player_ref_list.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
