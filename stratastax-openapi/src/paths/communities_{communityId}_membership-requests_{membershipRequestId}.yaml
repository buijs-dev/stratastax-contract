parameters:
  - $ref: ../components/parameters/path_community_id.yaml
  - $ref: ../components/parameters/path_membership_request_id.yaml
get:
  summary: Get membership request
  operationId: getMembershipRequest
  security:
    - bearerAuth:
        - stx-engine:membership-request-read
  tags:
    - membershipRequests
  responses:
    '200':
      $ref: ../components/responses/membership_request.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
patch:
  summary: Decide on a membership request (approve or reject)
  description: >
    Approves or rejects a pending request; the community's owner or a member of
    its admin group decides. On approval the user becomes a member. A decided
    request cannot be decided again (409).
  operationId: decideMembershipRequest
  security:
    - bearerAuth:
        - stx-engine:membership-request-decide
  tags:
    - membershipRequests
  parameters:
    - $ref: ../components/parameters/header_idempotency_key.yaml
    - $ref: ../components/parameters/header_if_match.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/requests/decide_membership_request.yaml
  responses:
    '200':
      $ref: ../components/responses/membership_request.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '409':
      $ref: ../components/responses/conflict_error.yaml
    '412':
      $ref: ../components/responses/precondition_failed_error.yaml
    '422':
      $ref: ../components/responses/unprocessable_content_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
