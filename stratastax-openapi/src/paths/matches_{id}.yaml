parameters:
  - $ref: ../components/parameters/path_id.yaml
get:
  summary: Get match
  operationId: getMatch
  tags:
    - matches
  responses:
    '200':
      $ref: ../components/responses/match.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
patch:
  summary: Update match
  description: >
    Updates match fields. While the match is DRAFT, all fields including
    participants may be changed here. Once FINALIZED, only playedAt and
    editRequestsEnabled remain directly editable; use POST /matches/{id}/edits
    for anything else.
  operationId: updateMatch
  tags:
    - matches
  parameters:
    - $ref: ../components/parameters/header_if_match.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/requests/update_match.yaml
  responses:
    '200':
      $ref: ../components/responses/match.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '409':
      $ref: ../components/responses/conflict_error.yaml
    '412':
      $ref: ../components/responses/precondition_failed_error.yaml
delete:
  summary: Delete match
  description: Only allowed while the match is DRAFT.
  operationId: deleteMatch
  tags:
    - matches
  parameters:
    - $ref: ../components/parameters/header_if_match.yaml
  responses:
    '204':
      description: Deleted successfully
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '409':
      $ref: ../components/responses/conflict_error.yaml
    '412':
      $ref: ../components/responses/precondition_failed_error.yaml
