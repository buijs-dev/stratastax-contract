parameters:
  - $ref: ../components/parameters/path_claim_request_id.yaml
get:
  summary: Get claim request
  operationId: getClaimRequest
  security:
    - bearerAuth:
        - stx-engine:claim-request-read
  tags:
    - claimRequests
  responses:
    '200':
      $ref: ../components/responses/claim_request.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
patch:
  summary: Decide on a claim request (approve or reject)
  description: >
    Approves or rejects a pending claim request; on approval a claim edge is
    created per ghost player. A decided request cannot be decided again (409).
  operationId: decideClaimRequest
  security:
    - bearerAuth:
        - stx-engine:claim-request-decide
  tags:
    - claimRequests
  parameters:
    - $ref: ../components/parameters/header_idempotency_key.yaml
    - $ref: ../components/parameters/header_if_match.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/requests/decide_claim_request.yaml
  responses:
    '200':
      $ref: ../components/responses/claim_request.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '409':
      $ref: ../components/responses/conflict_error.yaml
    '412':
      $ref: ../components/responses/precondition_failed_error.yaml
    '422':
      $ref: ../components/responses/unprocessable_content_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
