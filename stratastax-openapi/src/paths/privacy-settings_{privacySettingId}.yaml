parameters:
  - $ref: ../components/parameters/path_privacy_setting_id.yaml
get:
  summary: Get privacy setting
  operationId: getPrivacySetting
  security:
    - bearerAuth:
        - stx-engine:privacy-setting-read
  tags:
    - privacySettings
  responses:
    '200':
      $ref: ../components/responses/privacy_setting.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
patch:
  summary: Update privacy setting
  description: >
    Changes the level of a privacy setting and, for PRIVILEGED_ACCESS, the groups
    (owned by the caller) that get access.
  operationId: updatePrivacySetting
  security:
    - bearerAuth:
        - stx-engine:privacy-setting-update
  tags:
    - privacySettings
  parameters:
    - $ref: ../components/parameters/header_idempotency_key.yaml
    - $ref: ../components/parameters/header_if_match.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/requests/update_privacy_setting.yaml
  responses:
    '200':
      $ref: ../components/responses/privacy_setting.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '409':
      $ref: ../components/responses/conflict_error.yaml
    '412':
      $ref: ../components/responses/precondition_failed_error.yaml
    '422':
      $ref: ../components/responses/unprocessable_content_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
