get:
  summary: List claim requests
  description: >
    Filterable on `id`, `canonicalPlayerId`, `canonicalPlayerName`, `decidedById`,
    `decidedByName`, `status`, `ghostPlayersId`, `ghostPlayersName`, `createdAt`;
    sortable on `id`, `status`, `createdAt`.
  operationId: listClaimRequests
  security:
    - bearerAuth:
        - stx-engine:claim-request-read
  tags:
    - claimRequests
  parameters:
    - $ref: ../components/parameters/query_limit.yaml
    - $ref: ../components/parameters/query_cursor.yaml
    - $ref: ../components/parameters/query_filter.yaml
    - $ref: ../components/parameters/query_sort.yaml
  responses:
    '200':
      $ref: ../components/responses/claim_request_list.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
post:
  summary: Create a claim request
  description: >
    Proposes to link ghost players to the caller's canonical player. A deleted ghost player is unknown (400 NOT_FOUND); a ghost player with an active claim edge cannot be claimed (409).
  operationId: createClaimRequest
  security:
    - bearerAuth:
        - stx-engine:claim-request-create
  tags:
    - claimRequests
  parameters:
    - $ref: ../components/parameters/header_idempotency_key.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/requests/create_claim_request.yaml
  responses:
    '201':
      $ref: ../components/responses/created_claim_request.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '409':
      $ref: ../components/responses/conflict_error.yaml
    '422':
      $ref: ../components/responses/unprocessable_content_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
