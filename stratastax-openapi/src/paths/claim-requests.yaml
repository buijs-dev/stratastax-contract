get:
  summary: List claim requests
  operationId: listClaimRequests
  tags:
    - claimRequests
  parameters:
    - $ref: ../components/parameters/query_limit.yaml
    - $ref: ../components/parameters/query_cursor.yaml
    - $ref: ../components/parameters/query_filter.yaml
    - $ref: ../components/parameters/query_sort.yaml
  responses:
    '200':
      $ref: ../components/responses/claim_request_list.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
post:
  summary: Create a claim request
  operationId: createClaimRequest
  tags:
    - claimRequests
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/requests/create_claim_request.yaml
  responses:
    '201':
      $ref: ../components/responses/claim_request.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '409':
      $ref: ../components/responses/conflict_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
