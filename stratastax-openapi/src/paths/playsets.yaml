get:
  summary: List playsets
  description: >
    Soft-deleted playsets are never listed. Filterable on `id`, `name`,
    `variants`, `scenario`, `gameId`, `gameName`, `ownerId`, `ownerName`,
    `expansionsId`, `expansionsName`, `createdAt`, `updatedAt`; sortable on `id`,
    `name`, `scenario`, `createdAt`, `updatedAt`.
  operationId: listPlaysets
  security:
    - bearerAuth:
        - stx-engine:playset-read
  tags:
    - playsets
  parameters:
    - $ref: ../components/parameters/query_limit.yaml
    - $ref: ../components/parameters/query_cursor.yaml
    - $ref: ../components/parameters/query_filter.yaml
    - $ref: ../components/parameters/query_sort.yaml
  responses:
    '200':
      $ref: ../components/responses/playset_list.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
post:
  summary: Create playset
  operationId: createPlayset
  security:
    - bearerAuth:
        - stx-engine:playset-create
  tags:
    - playsets
  parameters:
    - $ref: ../components/parameters/header_idempotency_key.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/requests/create_playset.yaml
  responses:
    '201':
      $ref: ../components/responses/created_playset.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '409':
      $ref: ../components/responses/conflict_error.yaml
    '422':
      $ref: ../components/responses/unprocessable_content_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
