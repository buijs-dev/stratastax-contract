get:
  summary: List privacy settings for authenticated user
  operationId: listPrivacySettings
  security:
    - bearerAuth:
        - stx-engine:privacy-setting-read
  tags:
    - privacySettings
  parameters:
    - $ref: ../components/parameters/query_limit.yaml
    - $ref: ../components/parameters/query_cursor.yaml
    - $ref: ../components/parameters/query_filter.yaml
    - $ref: ../components/parameters/query_sort.yaml
  responses:
    '200':
      $ref: ../components/responses/privacy_setting_list.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
post:
  summary: Create or update a privacy setting
  operationId: createPrivacySetting
  security:
    - bearerAuth:
        - stx-engine:privacy-setting-create
  tags:
    - privacySettings
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/requests/create_privacy_setting.yaml
  responses:
    '201':
      $ref: ../components/responses/privacy_setting.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '409':
      $ref: ../components/responses/conflict_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
