parameters:
  - $ref: ../components/parameters/path_candidate_id.yaml
get:
  summary: Get candidate
  operationId: getCandidate
  security:
    - bearerAuth:
        - stx-game-catalog:candidate-read
  tags:
    - candidates
  responses:
    '200':
      $ref: ../components/responses/candidate.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
