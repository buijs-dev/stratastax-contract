get:
  summary: List ghost players
  description: >
    Deleted ghost players are never listed. Filterable on `id`, `name`, `isSelf`,
    `ownerId`, `ownerName`, `createdAt`, `updatedAt`; sortable on `id`, `name`,
    `createdAt`, `updatedAt`.
  operationId: listGhostPlayers
  security:
    - bearerAuth:
        - stx-engine:ghost-player-read
  tags:
    - ghostPlayers
  parameters:
    - $ref: ../components/parameters/query_limit.yaml
    - $ref: ../components/parameters/query_cursor.yaml
    - $ref: ../components/parameters/query_filter.yaml
    - $ref: ../components/parameters/query_sort.yaml
  responses:
    '200':
      $ref: ../components/responses/ghost_player_list.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
post:
  summary: Create ghost player
  operationId: createGhostPlayer
  security:
    - bearerAuth:
        - stx-engine:ghost-player-create
  tags:
    - ghostPlayers
  parameters:
    - $ref: ../components/parameters/header_idempotency_key.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/requests/create_ghost_player.yaml
  responses:
    '201':
      $ref: ../components/responses/created_ghost_player.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '409':
      $ref: ../components/responses/conflict_error.yaml
    '422':
      $ref: ../components/responses/unprocessable_content_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
