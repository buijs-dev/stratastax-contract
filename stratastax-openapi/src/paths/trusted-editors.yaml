get:
  summary: List trusted editors
  operationId: listTrustedEditors
  security:
    - bearerAuth:
        - stx-engine:trusted-editor-read
  tags:
    - trustedEditors
  parameters:
    - $ref: ../components/parameters/query_limit.yaml
    - $ref: ../components/parameters/query_cursor.yaml
    - $ref: ../components/parameters/query_filter.yaml
    - $ref: ../components/parameters/query_sort.yaml
  responses:
    '200':
      $ref: ../components/responses/trusted_editor_list.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
post:
  summary: Grant trusted editor access
  operationId: createTrustedEditor
  security:
    - bearerAuth:
        - stx-engine:trusted-editor-create
  tags:
    - trustedEditors
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/requests/create_trusted_editor.yaml
  responses:
    '201':
      $ref: ../components/responses/trusted_editor.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '409':
      $ref: ../components/responses/conflict_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
