parameters:
  - $ref: ../components/parameters/path_id.yaml
get:
  summary: Get playset
  operationId: getPlayset
  tags:
    - playsets
  responses:
    '200':
      $ref: ../components/responses/playset.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
patch:
  summary: Update playset
  operationId: updatePlayset
  tags:
    - playsets
  parameters:
    - $ref: ../components/parameters/header_if_match.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/requests/update_playset.yaml
  responses:
    '200':
      $ref: ../components/responses/playset.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '412':
      $ref: ../components/responses/precondition_failed_error.yaml
delete:
  summary: Delete playset
  operationId: deletePlayset
  tags:
    - playsets
  parameters:
    - $ref: ../components/parameters/header_if_match.yaml
  responses:
    '204':
      description: Deleted successfully
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '412':
      $ref: ../components/responses/precondition_failed_error.yaml
