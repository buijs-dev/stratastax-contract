parameters:
  - $ref: ../components/parameters/path_match_id.yaml
get:
  summary: Get match
  operationId: getMatch
  security:
    - bearerAuth:
        - stx-engine:match-read
  tags:
    - matches
  responses:
    '200':
      $ref: ../components/responses/match.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
patch:
  summary: Update match
  description: >
    Updates match fields. While the match is DRAFT, all fields including
    participants may be changed here; a participant that is left out of
    `participants` is deleted, together with its loadout. Once FINALIZED, only
    playedAt and editRequestsEnabled remain directly editable; use POST
    /matches/{matchId}/edits for anything else.
  operationId: updateMatch
  security:
    - bearerAuth:
        - stx-engine:match-update
  tags:
    - matches
  parameters:
    - $ref: ../components/parameters/header_idempotency_key.yaml
    - $ref: ../components/parameters/header_if_match.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/requests/update_match.yaml
  responses:
    '200':
      $ref: ../components/responses/match.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '409':
      $ref: ../components/responses/conflict_error.yaml
    '412':
      $ref: ../components/responses/precondition_failed_error.yaml
    '422':
      $ref: ../components/responses/unprocessable_content_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
delete:
  summary: Delete match
  description: >
    Only allowed while the match is DRAFT. The match is soft-deleted together with
    its participants: it is no longer listed or counted, and its participants no
    longer show up in anyone's history.
  operationId: deleteMatch
  security:
    - bearerAuth:
        - stx-engine:match-delete
  tags:
    - matches
  parameters:
    - $ref: ../components/parameters/header_idempotency_key.yaml
    - $ref: ../components/parameters/header_if_match.yaml
  responses:
    '204':
      $ref: ../components/responses/no_content.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '409':
      $ref: ../components/responses/conflict_error.yaml
    '412':
      $ref: ../components/responses/precondition_failed_error.yaml
    '422':
      $ref: ../components/responses/unprocessable_content_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
