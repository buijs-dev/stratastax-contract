parameters:
  - $ref: ../components/parameters/path_application_id.yaml
  - $ref: ../components/parameters/path_message_key.yaml
  - $ref: ../components/parameters/path_locale.yaml
put:
  summary: Write draft translation
  description: >
    Sets the draft text of the key in the locale. The text must be valid ICU
    and may only use the arguments of the key, with a compatible type;
    otherwise the response is 400 with the offending argument. The draft is
    published with the next release.
  operationId: updateTranslation
  security:
    - bearerAuth:
        - stx-i18n:translation-update
  tags:
    - keys
  parameters:
    - $ref: ../components/parameters/header_if_match.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/requests/update_translation.yaml
  responses:
    '200':
      $ref: ../components/responses/message_key.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '409':
      $ref: ../components/responses/conflict_error.yaml
    '412':
      $ref: ../components/responses/precondition_failed_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
delete:
  summary: Discard draft translation
  description: Discards the draft; the published text, if any, stays.
  operationId: discardTranslation
  security:
    - bearerAuth:
        - stx-i18n:translation-update
  tags:
    - keys
  parameters:
    - $ref: ../components/parameters/header_if_match.yaml
  responses:
    '204':
      description: Draft discarded
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '412':
      $ref: ../components/responses/precondition_failed_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
