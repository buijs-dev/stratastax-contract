get:
  summary: Get pipeline status
  description: >
    The run state of every automatic step and the number of ranking entries
    and candidates in every stage and status.
  operationId: getPipelineStatus
  security:
    - bearerAuth:
        - stx-game-catalog:pipeline-read
  tags:
    - pipeline
  responses:
    '200':
      $ref: ../components/responses/pipeline_status.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
