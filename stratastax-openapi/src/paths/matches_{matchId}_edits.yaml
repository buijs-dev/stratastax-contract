parameters:
  - $ref: ../components/parameters/path_match_id.yaml
get:
  summary: List edits for a match
  operationId: listMatchEdits
  tags:
    - matchEdits
  parameters:
    - $ref: ../components/parameters/query_limit.yaml
    - $ref: ../components/parameters/query_cursor.yaml
    - $ref: ../components/parameters/query_filter.yaml
    - $ref: ../components/parameters/query_sort.yaml
  responses:
    '200':
      $ref: ../components/responses/match_edit_list.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
post:
  summary: Propose a match edit
  operationId: createMatchEdit
  tags:
    - matchEdits
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/requests/create_match_edit.yaml
  responses:
    '201':
      $ref: ../components/responses/match_edit.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '409':
      $ref: ../components/responses/conflict_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
