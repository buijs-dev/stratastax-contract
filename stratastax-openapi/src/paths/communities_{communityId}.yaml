parameters:
  - $ref: ../components/parameters/path_community_id.yaml
get:
  summary: Get community
  operationId: getCommunity
  security:
    - bearerAuth:
        - stx-engine:community-read
  tags:
    - communities
  responses:
    '200':
      $ref: ../components/responses/community.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
patch:
  summary: Update community
  operationId: updateCommunity
  security:
    - bearerAuth:
        - stx-engine:community-update
  tags:
    - communities
  parameters:
    - $ref: ../components/parameters/header_idempotency_key.yaml
    - $ref: ../components/parameters/header_if_match.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/requests/update_community.yaml
  responses:
    '200':
      $ref: ../components/responses/community.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '409':
      $ref: ../components/responses/conflict_error.yaml
    '412':
      $ref: ../components/responses/precondition_failed_error.yaml
    '422':
      $ref: ../components/responses/unprocessable_content_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
delete:
  summary: Delete community
  description: >
    Soft-deletes the community: its matches keep referring to it, but it is no
    longer listed and cannot be joined.
  operationId: deleteCommunity
  security:
    - bearerAuth:
        - stx-engine:community-delete
  tags:
    - communities
  parameters:
    - $ref: ../components/parameters/header_idempotency_key.yaml
    - $ref: ../components/parameters/header_if_match.yaml
  responses:
    '204':
      $ref: ../components/responses/no_content.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '409':
      $ref: ../components/responses/conflict_error.yaml
    '412':
      $ref: ../components/responses/precondition_failed_error.yaml
    '422':
      $ref: ../components/responses/unprocessable_content_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
