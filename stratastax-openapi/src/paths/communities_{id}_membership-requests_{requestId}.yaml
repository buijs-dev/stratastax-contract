parameters:
  - $ref: ../components/parameters/path_id.yaml
  - $ref: ../components/parameters/path_request_id.yaml
get:
  summary: Get membership request
  operationId: getMembershipRequest
  tags:
    - membershipRequests
  responses:
    '200':
      $ref: ../components/responses/membership_request.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
patch:
  summary: Decide on a membership request (approve or reject)
  operationId: decideMembershipRequest
  tags:
    - membershipRequests
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/requests/decide_membership_request.yaml
  responses:
    '200':
      $ref: ../components/responses/membership_request.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '409':
      $ref: ../components/responses/conflict_error.yaml
