parameters:
  - $ref: ../components/parameters/path_game_id.yaml
get:
  summary: Get game
  operationId: getGame
  security:
    - bearerAuth:
        - stx-engine:game-read
  tags:
    - games
  responses:
    '200':
      $ref: ../components/responses/game.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
patch:
  summary: Update game
  description: >
    Changes a game of the catalogue. Requires the `stx-engine:game-update` role,
    which only the game catalog service has: it updates a game when a published
    candidate is approved again with new values.
  operationId: updateGame
  security:
    - bearerAuth:
        - stx-engine:game-update
  tags:
    - games
  parameters:
    - $ref: ../components/parameters/header_idempotency_key.yaml
    - $ref: ../components/parameters/header_if_match.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/requests/update_game.yaml
  responses:
    '200':
      $ref: ../components/responses/game.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '409':
      $ref: ../components/responses/conflict_error.yaml
    '412':
      $ref: ../components/responses/precondition_failed_error.yaml
    '422':
      $ref: ../components/responses/unprocessable_content_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
