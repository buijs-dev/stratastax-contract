openapi: 3.1.0
info:
  version: 1.0.0
  title: Stratastax API
  contact:
    name: Contact our support
    email: info@buijs.dev
    url: https://buijs.dev/
  license:
    name: Apache-2.0
    url: https://github.com/buijs-dev/stratastax-contract/blob/develop/LICENSE
  description: Match tracking API for the Stratastax engine platform.
servers:
  - url: https://stratastax.dev/rest
security:
  - bearerAuth: []
tags:
  - name: matches
    description: Match tracking operations.
  - name: matchEdits
    description: Match edit proposal and approval workflow.
  - name: games
    description: Game catalogue.
  - name: expansions
    description: Game expansion management.
  - name: playsets
    description: Playset configuration management.
  - name: ghostPlayers
    description: Ghost player management.
  - name: canonicalPlayers
    description: Canonical player profile.
  - name: trustedEditors
    description: Trusted editor grant management.
  - name: claimRequests
    description: Ghost player claim request workflow.
  - name: claimEdges
    description: Active ghost player claim edges.
  - name: privacySettings
    description: Privacy configuration per data type.
  - name: groups
    description: Group management for privileged access control.
  - name: communities
    description: Community management.
  - name: memberships
    description: Community membership management.
  - name: membershipRequests
    description: Community membership request workflow.
  - name: users
    description: The current user and finding other users.
paths:
  /api/v1/matches/count:
    $ref: ./paths/matches_count.yaml
  /api/v1/matches/{matchId}:
    $ref: './paths/matches_{matchId}.yaml'
  /api/v1/matches/{matchId}/finalize:
    $ref: './paths/matches_{matchId}_finalize.yaml'
  /api/v1/matches/{matchId}/edits:
    $ref: './paths/matches_{matchId}_edits.yaml'
  /api/v1/matches/{matchId}/edits/{editId}:
    $ref: './paths/matches_{matchId}_edits_{editId}.yaml'
  /api/v1/matches/{matchId}/participants/{matchParticipantId}/dispute:
    $ref: './paths/matches_{matchId}_participants_{matchParticipantId}_dispute.yaml'
  /api/v1/matches:
    $ref: ./paths/matches.yaml
  /api/v1/matches/batch:
    $ref: ./paths/matches_batch.yaml
  /api/v1/games/suggestions:
    $ref: ./paths/games_suggestions.yaml
  /api/v1/games/{gameId}:
    $ref: './paths/games_{gameId}.yaml'
  /api/v1/games/{gameId}/expansions:
    $ref: './paths/games_{gameId}_expansions.yaml'
  /api/v1/games/{gameId}/expansions/{expansionId}:
    $ref: './paths/games_{gameId}_expansions_{expansionId}.yaml'
  /api/v1/games:
    $ref: ./paths/games.yaml
  /api/v1/playsets:
    $ref: ./paths/playsets.yaml
  /api/v1/playsets/{playsetId}:
    $ref: './paths/playsets_{playsetId}.yaml'
  /api/v1/ghost-players/count:
    $ref: ./paths/ghost-players_count.yaml
  /api/v1/ghost-players/suggestions:
    $ref: ./paths/ghost-players_suggestions.yaml
  /api/v1/ghost-players/{ghostPlayerId}:
    $ref: './paths/ghost-players_{ghostPlayerId}.yaml'
  /api/v1/ghost-players:
    $ref: ./paths/ghost-players.yaml
  /api/v1/canonical-players/{canonicalPlayerId}:
    $ref: './paths/canonical-players_{canonicalPlayerId}.yaml'
  /api/v1/trusted-editors:
    $ref: ./paths/trusted-editors.yaml
  /api/v1/trusted-editors/{trustedEditorId}:
    $ref: './paths/trusted-editors_{trustedEditorId}.yaml'
  /api/v1/claim-requests:
    $ref: ./paths/claim-requests.yaml
  /api/v1/claim-requests/{claimRequestId}:
    $ref: './paths/claim-requests_{claimRequestId}.yaml'
  /api/v1/claim-edges:
    $ref: ./paths/claim-edges.yaml
  /api/v1/claim-edges/{claimEdgeId}:
    $ref: './paths/claim-edges_{claimEdgeId}.yaml'
  /api/v1/privacy-settings:
    $ref: ./paths/privacy-settings.yaml
  /api/v1/privacy-settings/{privacySettingId}:
    $ref: './paths/privacy-settings_{privacySettingId}.yaml'
  /api/v1/groups:
    $ref: ./paths/groups.yaml
  /api/v1/groups/{groupId}:
    $ref: './paths/groups_{groupId}.yaml'
  /api/v1/groups/{groupId}/members:
    $ref: './paths/groups_{groupId}_members.yaml'
  /api/v1/groups/{groupId}/members/{userId}:
    $ref: './paths/groups_{groupId}_members_{userId}.yaml'
  /api/v1/communities:
    $ref: ./paths/communities.yaml
  /api/v1/communities/{communityId}:
    $ref: './paths/communities_{communityId}.yaml'
  /api/v1/communities/{communityId}/memberships:
    $ref: './paths/communities_{communityId}_memberships.yaml'
  /api/v1/communities/{communityId}/memberships/{userId}:
    $ref: './paths/communities_{communityId}_memberships_{userId}.yaml'
  /api/v1/communities/{communityId}/membership-requests:
    $ref: './paths/communities_{communityId}_membership-requests.yaml'
  /api/v1/communities/{communityId}/membership-requests/{membershipRequestId}:
    $ref: './paths/communities_{communityId}_membership-requests_{membershipRequestId}.yaml'
  /api/v1/users/me:
    $ref: ./paths/users_me.yaml
  /api/v1/users/suggestions:
    $ref: ./paths/users_suggestions.yaml
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
