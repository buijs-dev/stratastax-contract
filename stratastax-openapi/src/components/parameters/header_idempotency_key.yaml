name: Idempotency-Key
in: header
required: true
description: >
  Client-generated UUIDv7, required on every mutating request (POST, PUT, PATCH, DELETE), that
  makes the request safe to retry. A repeated request with the same key and the same payload
  returns the stored response (marked with the `Idempotent-Replayed: true` header) instead of
  executing again; the same key with a different payload is refused with 422. Keys older than the
  retention window (30 days) are rejected. A key that is not a UUID is refused with 400.
schema:
  # Not `format: uuid`: the service reads the key as text and answers an invalid one with a
  # problem of its own, instead of a framework conversion error.
  type: string
  examples:
    - 0192f100-0000-7000-8000-0000000000a5
