type: object
properties:
  displayName:
    type: [string, "null"]
  description:
    type: [string, "null"]
  minPlayers:
    type: [integer, "null"]
    format: int32
  maxPlayers:
    type: [integer, "null"]
    format: int32
  imageUrl:
    type: [string, "null"]
    format: uri
  tags:
    type: [array, "null"]
    items:
      type: string
  scoreType:
    anyOf:
      - $ref: ../schemas/score_type.yaml
      - type: "null"
  winCondition:
    anyOf:
      - $ref: ../schemas/win_condition.yaml
      - type: "null"
