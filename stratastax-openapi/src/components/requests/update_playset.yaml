type: object
description: >
  Every field is optional; an absent field keeps its value. Only displayName and scenario accept
  null, which clears them.
properties:
  displayName:
    anyOf:
      - $ref: ../schemas/playset_display_name.yaml
      - type: "null"
  scenario:
    anyOf:
      - $ref: ../schemas/scenario.yaml
      - type: "null"
  variants:
    $ref: ../schemas/variant_list.yaml
  expansions:
    type: array
    description: Replaces the expansions; an empty list removes them all
    uniqueItems: true
    items:
      type: string
      format: uuid
