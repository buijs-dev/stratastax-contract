type: object
required:
  - dataType
  - level
properties:
  dataType:
    type: string
    enum:
      - PROFILE
      - MATCH_HISTORY
      - MATCH_DETAILS
  level:
    $ref: ../schemas/visibility.yaml
  groupIds:
    type: array
    description: Only meaningful when level is PRIVILEGED_ACCESS
    items:
      type: string
      format: uuid
