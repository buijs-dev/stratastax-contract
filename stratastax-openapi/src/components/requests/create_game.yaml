type: object
required:
  - displayName
  - description
  - minPlayers
  - maxPlayers
  - scoreType
  - tags
properties:
  displayName:
    type: string
  description:
    type: string
  minPlayers:
    type: integer
    format: int32
  maxPlayers:
    type: integer
    format: int32
  imageUrl:
    type: string
    format: uri
  tags:
    type: array
    items:
      type: string
    default: []
  scoreType:
    $ref: ../schemas/score_type.yaml
  winCondition:
    $ref: ../schemas/win_condition.yaml
  sourceRef:
    type: string
    maxLength: 64
    description: >
      Where the game came from, e.g. `bgg:199792`. Unique: creating a second
      game with the same source is refused with 409.
