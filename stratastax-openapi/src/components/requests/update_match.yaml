type: object
description: >
  Update match fields; an absent field keeps its value, and only playsetId and communityId accept
  null (to clear them). While the match has status DRAFT, all fields below may be updated
  directly. Once the match is FINALIZED, only playedAt and editRequestsEnabled remain directly
  editable; attempting to change playsetId, communityId, expansions or participants of a
  finalized match returns 409 Conflict; use POST /matches/{matchId}/edits instead.
properties:
  playsetId:
    type: [string, "null"]
    format: uuid

  communityId:
    type: [string, "null"]
    format: uuid

  playedAt:
    $ref: ../schemas/date_time.yaml

  editRequestsEnabled:
    type: boolean

  expansions:
    type: array
    uniqueItems: true
    items:
      type: string
      format: uuid
    description: |
      Replaces the complete expansion collection; an empty list removes all expansions.

      If omitted, the existing expansions remain unchanged.

  participants:
    type: array
    minItems: 1
    description: |
      Replaces the complete participant collection.

      If omitted, the existing participants remain unchanged.
      If provided, the complete participant collection is replaced
      by the supplied collection: a participant that is no longer in it
      is deleted, together with its loadout.

      Each participant must be fully specified. Partial participant
      updates are not supported while the match is in DRAFT status.
    items:
      $ref: ./match_participant_input.yaml
