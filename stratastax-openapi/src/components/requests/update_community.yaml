type: object
description: >
  Every field is optional; an absent field keeps its value. Only description and adminGroupId
  accept null, which clears them.
properties:
  displayName:
    $ref: ../schemas/display_name.yaml
  description:
    anyOf:
      - $ref: ../schemas/description.yaml
      - type: "null"
  joinPolicy:
    $ref: ../schemas/join_policy.yaml
  adminGroupId:
    type: [string, "null"]
    format: uuid
