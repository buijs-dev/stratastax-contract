description: Request validation failed
content:
  application/problem+json:
    schema:
      $ref: ../schemas/validation_problem_detail.yaml
    examples:
      bad_request:
        value:
          type: https://errors.stratastax.dev/validation
          title: Bad Request
          status: 400
          detail: Received invalid request data
          errors:
            - field: displayName
              code: REQUIRED
              message: missing required field
      duplicate:
        value:
          type: https://errors.stratastax.dev/validation
          title: Bad Request
          status: 400
          detail: Received invalid request data
          errors:
            - field: participants[2].ghostPlayerId
              code: DUPLICATE_GHOST_PLAYER
              message: the ghost player already takes part in this match
      filter_field_not_allowed:
        value:
          type: https://errors.stratastax.dev/validation
          title: Bad Request
          status: 400
          detail: Request validation failed
          errors:
            - field: query
              code: INVALID_SEARCH
              message: "'nonsense' is not a filterable field"
