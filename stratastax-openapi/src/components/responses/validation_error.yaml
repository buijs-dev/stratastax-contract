description: Request validation failed
content:
  application/problem+json:
    schema:
      $ref: ../schemas/validation_problem_detail.yaml
    examples:
      bad_request:
        value:
          type: https://errors.stratastax.dev/validation
          title: Bad Request
          status: 400
          detail: Received invalid request data
          errors:
            - field: displayName
              code: REQUIRED
              message: missing required field
      duplicate:
        value:
          type: https://errors.stratastax.dev/validation
          title: Bad Request
          status: 400
          detail: Received invalid request data
          errors:
            - field: participants[2].ghostPlayerId
              code: DUPLICATE
              message: the ghost player already takes part in this match
      filter_field_not_allowed:
        value:
          type: https://errors.stratastax.dev/validation
          title: Bad Request
          status: 400
          detail:
            The filter expression references a field that is not filterable
          errors:
            - field: filter
              code: FIELD_NOT_FILTERABLE
              message: "'gameName' is not a filterable field for this resource"
