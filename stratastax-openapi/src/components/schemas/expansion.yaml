type: object
required:
  - id
  - game
  - displayName
  - createdAt
properties:
  id:
    type: string
    format: uuid
  game:
    $ref: ./game_ref.yaml
  displayName:
    type: string
  description:
    type: string
  imageUrl:
    type: string
    format: uri
  sourceRef:
    type: string
    description: Where it came from, e.g. `bgg:199792`; absent for one entered by hand.
  createdAt:
    $ref: ./date_time.yaml
  updatedAt:
    $ref: ./date_time.yaml
