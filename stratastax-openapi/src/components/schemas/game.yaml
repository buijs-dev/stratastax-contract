type: object
required:
  - id
  - displayName
  - description
  - minPlayers
  - maxPlayers
  - scoreType
  - tags
properties:
  id:
    type: string
    format: uuid
  displayName:
    type: string
  description:
    type: string
  minPlayers:
    type: integer
    format: int32
  maxPlayers:
    type: integer
    format: int32
  imageUrl:
    type: string
    format: uri
  tags:
    type: array
    items:
      type: string
  scoreType:
    $ref: ./score_type.yaml
  winCondition:
    $ref: ./win_condition.yaml
  expansions:
    type: array
    items:
      $ref: ./expansion.yaml
  createdAt:
    $ref: ./date_time.yaml
  updatedAt:
    $ref: ./date_time.yaml
