type: object
required:
  - id
  - owner
  - displayName
  - members
  - createdAt
properties:
  id:
    type: string
    format: uuid
  owner:
    $ref: ./user_ref.yaml
  displayName:
    $ref: ./display_name.yaml
  members:
    type: array
    items:
      $ref: ./user_ref.yaml
  createdAt:
    $ref: ./date_time.yaml
  updatedAt:
    $ref: ./date_time.yaml
  deletedAt:
    $ref: ./date_time.yaml
