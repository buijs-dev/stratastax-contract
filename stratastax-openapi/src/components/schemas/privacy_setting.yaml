type: object
required:
  - id
  - user
  - dataType
  - level
  - createdAt
properties:
  id:
    type: string
    format: uuid
  user:
    $ref: ./user_ref.yaml
  dataType:
    type: string
    enum:
      - PROFILE
      - MATCH_HISTORY
      - MATCH_DETAILS
  level:
    $ref: ./visibility.yaml
  groups:
    type: array
    description: Only meaningful when level is PRIVILEGED_ACCESS
    items:
      $ref: ./group_ref.yaml
  createdAt:
    $ref: ./date_time.yaml
  updatedAt:
    $ref: ./date_time.yaml
