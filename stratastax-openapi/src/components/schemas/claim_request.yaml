type: object
required:
  - id
  - canonicalPlayer
  - status
  - ghostPlayers
  - createdAt
properties:
  id:
    type: string
    format: uuid
  canonicalPlayer:
    $ref: ./canonical_player_ref.yaml
  validatedBy:
    $ref: ./user_ref.yaml
  status:
    $ref: ./approval_status.yaml
  ghostPlayers:
    type: array
    minItems: 1
    items:
      $ref: ./ghost_player_ref.yaml
  createdAt:
    $ref: ./date_time.yaml
