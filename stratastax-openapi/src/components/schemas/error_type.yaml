type: string
description: >
  Canonical error type identifier (URI). The values are the problem types of stratastax-http's
  problem-core; stratastax-codegen fails the build of a service when the two disagree.
enum:
  - https://errors.stratastax.dev/authentication
  - https://errors.stratastax.dev/authorization
  - https://errors.stratastax.dev/validation
  - https://errors.stratastax.dev/not-found
  - https://errors.stratastax.dev/conflict
  - https://errors.stratastax.dev/precondition-failed
  - https://errors.stratastax.dev/internal
