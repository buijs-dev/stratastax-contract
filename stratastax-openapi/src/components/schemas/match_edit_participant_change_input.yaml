type: object
description: >
  A proposed change to one participant's result. A property that is absent is
  left unchanged; a property that is present replaces the current value, and
  null clears it. A participant appears at most once per edit (400 DUPLICATE).
required:
  - matchParticipantId
properties:
  matchParticipantId:
    type: string
    format: uuid
  score:
    anyOf:
      - $ref: ./score.yaml
      - type: "null"
  rank:
    anyOf:
      - $ref: ./rank.yaml
      - type: "null"
  outcome:
    anyOf:
      - $ref: ./outcome.yaml
      - type: "null"
