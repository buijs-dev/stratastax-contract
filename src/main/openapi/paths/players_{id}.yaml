parameters:
  - $ref: ../components/parameters/path_id.yaml

get:
  summary: Get player
  operationId: getPlayer
  tags:
    - players
  responses:
    '200':
      $ref: ../components/responses/player.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml

put:
  summary: Update player
  operationId: updatePlayer
  tags:
    - players
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/requests/update_player.yaml
  responses:
    '200':
      $ref: ../components/responses/player.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml

delete:
  summary: Delete player
  operationId: deletePlayer
  tags:
    - players
  responses:
    '204':
      description: Deleted successfully
    '404':
      $ref: ../components/responses/not_found_error.yaml
