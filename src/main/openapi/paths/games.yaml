get:
  summary: List games
  operationId: listGames
  tags:
    - games
  responses:
    '200':
      $ref: ../components/responses/game_list.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml

post:
  summary: Create game
  operationId: createGame
  tags:
    - games
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/requests/create_game.yaml
  responses:
    '201':
      $ref: ../components/responses/game.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '401':
      $ref: ../components/responses/unauthorized_error.yaml
    '403':
      $ref: ../components/responses/forbidden_error.yaml
    '409':
      $ref: ../components/responses/conflict_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
