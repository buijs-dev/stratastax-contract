get:
  summary: List matches
  operationId: listMatches
  tags:
    - matches
  parameters:
    - $ref: ../components/parameters/query_limit.yaml
    - $ref: ../components/parameters/query_offset.yaml
    - $ref: ../components/parameters/query_game_id.yaml
    - $ref: ../components/parameters/query_match_winner_player_id.yaml
    - $ref: ../components/parameters/query_date_from.yaml
    - $ref: ../components/parameters/query_date_to.yaml
    - $ref: ../components/parameters/query_search.yaml
    - $ref: ../components/parameters/query_search_mode.yaml
    - $ref: ../components/parameters/query_match_sort.yaml
    - $ref: ../components/parameters/query_game_name.yaml
    - $ref: ../components/parameters/query_game_expansion_id.yaml
    - $ref: ../components/parameters/query_game_expansion_name.yaml
    - $ref: ../components/parameters/query_match_winner_player_name.yaml
    - $ref: ../components/parameters/query_visibility.yaml
    - $ref: ../components/parameters/query_status.yaml
    - $ref: ../components/parameters/query_created_at.yaml
    - $ref: ../components/parameters/query_created_by.yaml
    - $ref: ../components/parameters/query_updated_at.yaml
    - $ref: ../components/parameters/query_updated_by.yaml
    - $ref: ../components/parameters/query_deleted_at.yaml
    - $ref: ../components/parameters/query_deleted_by.yaml
  responses:
    '200':
      $ref: ../components/responses/match_list.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml

post:
  summary: Create match
  operationId: createMatch
  tags:
    - matches
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/requests/create_match.yaml
  responses:
    '201':
      $ref: ../components/responses/match.yaml
    '400':
      $ref: ../components/responses/validation_error.yaml
    '409':
      $ref: ../components/responses/conflict_error.yaml
    '500':
      $ref: ../components/responses/internal_server_error.yaml
