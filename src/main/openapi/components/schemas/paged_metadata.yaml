type: 'object'
required:
  - 'total'
  - 'limit'
  - 'offset'
properties:
  total:
    type: 'integer'
    format: 'int64'
    description: 'Total number of matching records across all pages'
  limit:
    type: 'integer'
    format: 'int32'
    description: 'Maximum number of items returned in this page'
  offset:
    type: 'integer'
    format: 'int32'
    description: 'Number of items skipped before this page'
