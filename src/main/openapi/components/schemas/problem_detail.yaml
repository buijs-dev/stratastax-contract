type: 'object'
required:
  - 'type'
  - 'title'
  - 'status'
  - 'detail'
properties:
  type:
    $ref: ./error_type.yaml
  title:
    type: 'string'
    description: 'Short, human-readable summary'
  status:
    type: 'integer'
    format: 'int32'
    description: 'HTTP status code'
  detail:
    type: 'string'
    description: 'Human-readable explanation'
  instance:
    type: 'string'
    format: 'uri'
    description: 'URI of the request that caused the error'
