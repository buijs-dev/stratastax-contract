openapi: 3.1.0
info:
  version: 1.0.0
  title: 'Stratastax API'
  contact:
    name: Contact our support
    email: info@buijs.dev
    url: https://buijs.dev/
  license:
    name: 'Apache-2.0'
    url: 'https://github.com/buijs-dev/stratastax-contract/blob/develop/LICENSE'
  description: Match tracking API for the Stratastax engine platform.

tags:
  - name: Matches
    description: Match tracking operations.
  - name: Players
    description: Player management operations.
  - name: games
    description: Game catalogue

servers:
  - url: https://stratastax.io/api/v1

security:
  - bearerAuth: []

paths:
  '/api/v1/matches/count':
    $ref: 'paths/matches_count.yaml'
  '/api/v1/matches/{id}':
    $ref: 'paths/matches_{id}.yaml'
  '/api/v1/matches':
    $ref: 'paths/matches.yaml'
  '/api/v1/players/count':
    $ref: 'paths/players_count.yaml'
  '/api/v1/players/suggestions':
    $ref: 'paths/players_suggestions.yaml'
  '/api/v1/players/{id}':
    $ref: 'paths/players_{id}.yaml'
  '/api/v1/players':
    $ref: 'paths/players.yaml'
  '/api/v1/games/suggestions':
    $ref: 'paths/games_suggestions.yaml'
  '/api/v1/games/{id}':
    $ref: 'paths/games_{id}.yaml'
  '/api/v1/games':
    $ref: 'paths/games.yaml'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
